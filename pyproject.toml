[build-system]
requires = ["setuptools>=77"]
build-backend = "setuptools.build_meta"

[project]
name = "redops-toolkit"
version = "0.1.0"
description = "Scoped inventory and evidence-based vulnerability assessment"
readme = "README.md"
requires-python = ">=3.11"
dependencies = [
    "SQLAlchemy>=2.0.36,<2.1",
    "PyYAML>=6.0.2,<7",
    "defusedxml>=0.7.1,<0.8",
    "msgpack>=1.1,<2",
    "fpdf2>=2.8.3,<3",
    "fastapi>=0.115,<1",
    "uvicorn>=0.34,<1",
    "Jinja2>=3.1.6,<4",
    "uharfbuzz>=0.53,<1",
    "fonttools>=4.59,<5",
]

[project.optional-dependencies]
postgres = ["psycopg[binary]>=3.2,<4"]
dev = [
    "pytest>=8.3,<10", "ruff>=0.11,<1", "build>=1.2,<2", "httpx2>=2.12,<3",
    "pypdf>=5,<7", "setuptools>=77", "wheel>=0.45,<1",
    # Starlette's TestClient still imports an alias deprecated in AnyIO 4.15.
    "anyio>=4.14.2,<4.15",
]
browser = ["pytest-playwright>=0.9,<1"]

[project.scripts]
redops = "redops.cli.main:main"

[tool.setuptools.packages.find]
include = ["redops*"]

[tool.setuptools.package-data]
redops = ["web/templates/*.html", "web/static/*.css", "web/static/*.js", "web/static/*.png", "reporting/fonts/*"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-q"

[tool.ruff]
target-version = "py311"
line-length = 100

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B"]
