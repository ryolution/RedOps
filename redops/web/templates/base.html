{% from 'macros.html' import icon %}
<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8"><meta name="viewport" content="width=device-width, initial-scale=1">
  <title>{% block title %}RedOps{% endblock %}</title>
  <link rel="icon" type="image/png" href="{{ url_for('ui_static', path='redops-mark.png') }}">
  <link rel="apple-touch-icon" href="{{ url_for('ui_static', path='redops-mark.png') }}">
  <link rel="stylesheet" href="{{ url_for('ui_static', path='app.css') }}">
  <script defer src="{{ url_for('ui_static', path='app.js') }}"></script>
</head>
<body class="{% block body_class %}{% if session and session.authenticated %}workspace-page{% else %}auth-page{% endif %}{% endblock %}">
<a class="skip" href="#main">Skip to content</a>
{% if session and session.authenticated %}
<header class="topbar">
  <a class="brand" href="/ui" aria-label="RedOps home"><img class="brandmark" src="{{ url_for('ui_static', path='redops-mark.png') }}" width="52" height="52" alt=""></a>
  <nav aria-label="Main navigation"><a class="navitem" href="/ui" {% if request.url.path == '/ui' %}aria-current="page"{% endif %}>{{ icon('grid') }}<span>Assessments</span></a></nav>
  <form action="/ui/logout" method="post" class="logout">
    <input type="hidden" name="csrf" value="{{ session.csrf }}">
    <span class="operator">{{ operator }}</span>
    <button class="quiet icon-button" type="submit" aria-label="Sign out" title="Sign out">{{ icon('logout') }}</button>
  </form>
</header>
{% endif %}
<div class="layout">
<main id="main" class="main" tabindex="-1">{% block content %}{% endblock %}</main>
</div>
<div id="copy-status" role="status" class="toast" hidden></div>
</body></html>
