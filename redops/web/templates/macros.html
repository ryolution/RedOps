{% macro pages(pagination, label='Pages') %}
<nav class="pagination" aria-label="{{ label }}">
  {% if pagination.previous %}<a class="button secondary" href="{{ pagination.previous }}">Previous</a>{% endif %}
  <span>Page {{ pagination.number }}</span>
  {% if pagination.next %}<a class="button secondary" href="{{ pagination.next }}">Next</a>{% endif %}
</nav>
{% endmacro %}

{% macro timestamp(value) -%}
<time datetime="{{ value }}" title="{{ value }}"><span class="exact-time">{{ value }}</span><span class="mobile-time" aria-hidden="true">{{ value }}</span></time>
{%- endmacro %}

{% macro icon(name) -%}
<svg class="icon" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.7" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true" focusable="false">
{% if name == 'grid' %}<rect x="3" y="3" width="7" height="7" rx="2"/><rect x="14" y="3" width="7" height="7" rx="2"/><rect x="3" y="14" width="7" height="7" rx="2"/><rect x="14" y="14" width="7" height="7" rx="2"/>
{% elif name == 'logout' %}<path d="M9 4H5a2 2 0 0 0-2 2v12a2 2 0 0 0 2 2h4M14 8l4 4-4 4M8 12h12"/>
{% elif name == 'download' %}<path d="M12 3v12m-4-4 4 4 4-4M4 16v3a2 2 0 0 0 2 2h12a2 2 0 0 0 2-2v-3"/>
{% elif name == 'arrow' %}<path d="m10 5-7 7 7 7M3 12h18"/>
{% elif name == 'chevron' %}<path d="m9 5 7 7-7 7"/>
{% elif name == 'search' %}<circle cx="10.5" cy="10.5" r="6.5"/><path d="m16 16 4.5 4.5"/>
{% elif name == 'filter' %}<path d="M4 7h16M7 12h10M10 17h4"/>
{% elif name == 'menu' %}<path d="M4 6h16M4 12h16M4 18h16"/>
{% elif name == 'history' %}<path d="M3 10a9 9 0 1 1 1 7M3 4v6h6M12 7v5l3 2"/>
{% elif name == 'server' %}<rect x="3" y="3" width="18" height="7" rx="2"/><rect x="3" y="14" width="18" height="7" rx="2"/><path d="M7 6.5h.01M7 17.5h.01M12 6.5h5M12 17.5h5"/>
{% elif name == 'shield' %}<path d="m12 3 8 3v6c0 5-8 9-8 9s-8-4-8-9V6l8-3Z"/><path d="M12 8v5m0 3h.01"/>
{% elif name == 'file' %}<path d="M14 3H6a2 2 0 0 0-2 2v14a2 2 0 0 0 2 2h12a2 2 0 0 0 2-2V9l-6-6Zm0 0v6h6M8 13h8M8 17h5"/>
{% endif %}
</svg>
{%- endmacro %}
