name: checks
on: [push, pull_request]
permissions:
  contents: read
jobs:
  test:
    runs-on: ubuntu-latest
    strategy:
      matrix:
        python: ['3.11', '3.13', '3.14']
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '${{ matrix.python }}'
      - run: python -m pip install -e '.[dev]'
      - run: ruff check .
      - run: ruff format --check .
      - run: pytest
      - run: python -m build
  postgres:
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:17
        env:
          POSTGRES_USER: redops
          POSTGRES_PASSWORD: test-only-ci-password
          POSTGRES_DB: redops_test
        ports: ['5432:5432']
        options: >-
          --health-cmd "pg_isready -U redops -d redops_test"
          --health-interval 5s --health-timeout 5s --health-retries 10
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.13'
      - run: python -m pip install -e '.[dev,postgres]'
      - run: pytest tests/test_postgres.py
        env:
          REDOPS_TEST_POSTGRES_URL: postgresql+psycopg://redops:test-only-ci-password@localhost:5432/redops_test
  container:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - run: docker compose config --quiet
      - run: docker build -t redops .
      - name: Run isolated offline workflow
        run: >-
          docker run --rm --network none --read-only --cap-drop ALL
          --security-opt no-new-privileges --tmpfs /tmp
          --tmpfs /data:uid=10001,gid=10001 --tmpfs /reports:uid=10001,gid=10001
          redops workflow run --scope labs/demo-scope.yaml --input labs/demo-nmap.xml
          --catalog labs/demo-catalog.json --output-dir /reports
  inventory-lab:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Start twelve healthy fixtures on an internal network
        run: docker compose -p redops-ci-lab -f labs/inventory/compose.yaml up --build --wait
      - name: Check real TCP inventory
        run: |
          docker compose -p redops-ci-lab -f labs/inventory/compose.yaml build scanner
          docker compose -p redops-ci-lab -f labs/inventory/compose.yaml run --rm scanner > /tmp/inventory.json
          python - <<'PY'
          import json
          from pathlib import Path
          result = json.loads(Path('/tmp/inventory.json').read_text())
          assert result['status'] == 'completed'
          assert len(result['hosts']) == 12
          assert result['targets_without_open_ports'] == []
          assert all(host['services'][0]['port'] == {'number': 8080, 'protocol': 'tcp'} for host in result['hosts'])
          PY
      - name: Remove test containers and data
        if: always()
        run: docker compose -p redops-ci-lab -f labs/inventory/compose.yaml down --volumes
